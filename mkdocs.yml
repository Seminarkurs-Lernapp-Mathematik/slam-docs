# mkdocs.yml in deinem Docs-Repo

site_name: SLAM Docs
# URL zur fertigen Seite (GitHub Pages URL des Docs-Repos)
site_url: https://docs.learn-smart.app

# WICHTIG: Hier die URL zum ECHTEN App-Code eintragen, nicht zum Docs-Repo
repo_url: https://github.com/Seminarkurs-Lernapp-Mathematik/slam-app
repo_name: GitHub # Text neben dem Icon

theme:
  name: material
  language: de
  palette:
    # Light Mode
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark Mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant # Lädt Seiten ohne Refresh
    - navigation.sections # Gruppiert die Sidebar
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition # Für Info-Boxen (!!! note)
